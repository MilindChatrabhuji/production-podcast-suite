      <!-- Feature 3 -->
      <circle cx="12" cy="80" r="10" fill="#6366F1"/>
      <path d="M 8 80 L 11 83 L 16 77" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="32" y="84" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif" font-weight="600">3 Viral Video Clips with FFmpeg Crop Cues</text>

      <!-- Feature 4 -->
      <circle cx="12" cy="114" r="10" fill="#6366F1"/>
      <path d="M 8 114 L 11 117 L 16 111" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="32" y="118" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif" font-weight="600">B2B Retainer Kit ($500 - $3,000/mo Tiers)</text>
    </g>

    <!-- Commercials Bar -->
    <g transform="translate(0, 385)">
      <rect x="0" y="0" width="470" height="52" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#334155"/>
      <text x="18" y="32" fill="#38BDF8" font-size="16" font-family="-apple-system, sans-serif" font-weight="800">$9 Single / $19 Master Suite</text>
      <text x="250" y="32" fill="#10B981" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">&#8226; $500 - $3,000 Retainers</text>
    </g>
  </g>
</svg>