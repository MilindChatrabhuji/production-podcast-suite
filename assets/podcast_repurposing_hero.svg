    <!-- Mockup Header -->
    <path d="M 0 16 Q 0 0 16 0 L 504 0 Q 520 0 520 16 L 520 70 L 0 70 Z" fill="#0F172A"/>
    <circle cx="28" cy="35" r="6" fill="#EF4444"/>
    <circle cx="48" cy="35" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="35" r="6" fill="#10B981"/>
    <text x="100" y="40" fill="#E2E8F0" font-size="13" font-family="-apple-system, sans-serif" font-weight="600">Podcast Multiplier Engine &#8226; Episode #55</text>

    <!-- Waveform & Chapter Bar -->
    <rect x="30" y="95" width="460" height="75" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="45" y="120" fill="#0F172A" font-size="14" font-family="-apple-system, sans-serif" font-weight="800">Cardiovascular Trials in Preserved EF</text>
    <text x="45" y="145" fill="#64748B" font-size="11" font-family="-apple-system, sans-serif">00:00 Intro &#8226; 00:45 JACC Trial Data &#8226; 02:40 Mechanisms &#8226; 05:12 Clinical Takeaways</text>

    <!-- Derivative Assets Grid -->
    <g transform="translate(30, 185)">
      <!-- Item 1: Show Notes -->
      <rect x="0" y="0" width="220" height="75" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="14" y="24" fill="#1E40AF" font-size="11" font-weight="800" font-family="-apple-system, sans-serif">EXECUTIVE SHOW NOTES</text>
      <text x="14" y="44" fill="#1E3A8A" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">Takeaways &amp; Citations</text>
      <text x="14" y="62" fill="#60A5FA" font-size="10" font-family="-apple-system, sans-serif">YouTube &amp; Spotify Chapters</text>

      <!-- Item 2: Video Clips -->
      <rect x="240" y="0" width="220" height="75" rx="6" fill="#FDF2F8" stroke="#FBCFE8"/>
      <text x="254" y="24" fill="#9D174D" font-size="11" font-weight="800" font-family="-apple-system, sans-serif">3 VERTICAL CLIPS (9:16)</text>
      <text x="254" y="44" fill="#831843" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">30s / 60s / 90s FFmpeg</text>
      <text x="254" y="62" fill="#F472B6" font-size="10" font-family="-apple-system, sans-serif">TikTok, Reels, Shorts Cues</text>

      <!-- Item 3: SEO Blog -->
