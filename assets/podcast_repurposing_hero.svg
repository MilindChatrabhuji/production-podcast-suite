      <!-- Feature 1 -->
      <circle cx="12" cy="12" r="10" fill="#6366F1"/>
      <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="32" y="16" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif" font-weight="600">Whisper/VTT Ingest &amp; Filler Word Scrubber</text>

