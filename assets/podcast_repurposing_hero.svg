      <text x="14" y="114" fill="#166534" font-size="11" font-weight="800" font-family="-apple-system, sans-serif">1,500-WORD SEO BLOG</text>
      <text x="14" y="134" fill="#14532D" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">H2/H3 + FAQ Schema</text>
      <text x="14" y="152" fill="#4ADE80" font-size="10" font-family="-apple-system, sans-serif">Google Rich Snippets JSON-LD</text>

      <!-- Item 4: Social Threads -->
      <rect x="240" y="90" width="220" height="75" rx="6" fill="#FAF5FF" stroke="#E9D5FF"/>
      <text x="254" y="114" fill="#6B21A8" font-size="11" font-weight="800" font-family="-apple-system, sans-serif">SOCIAL DISTRIBUTION</text>
      <text x="254" y="134" fill="#581C87" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">7-Part Thread &amp; Carousel</text>
      <text x="254" y="152" fill="#C084FC" font-size="10" font-family="-apple-system, sans-serif">LinkedIn &amp; X Formatted</text>
    </g>

    <!-- Mockup Bottom Notice -->
    <rect x="30" y="375" width="460" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="45" y="400" fill="#0F172A" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">Guaranteed 48-Hour Multi-Platform Turnaround</text>
    <text x="45" y="422" fill="#64748B" font-size="11" font-family="-apple-system, sans-serif">1 Hour Raw Audio &#8594; 12 Distribution Assets &#8226; 80% Creator Time Saved</text>
  </g>

  <!-- Right Typography & Product Badges -->
  <g transform="translate(650, 110)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" stroke-width="1.5"/>
    <text x="20" y="22" fill="#C084FC" font-size="13" font-family="-apple-system, sans-serif" font-weight="700" letter-spacing="1">WAY #53 &#8226; PRODUCT #55</text>

